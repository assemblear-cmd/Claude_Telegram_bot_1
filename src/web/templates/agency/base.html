<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Agency42{% endblock %}</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a2e;
            --border: #2a2a3e;
            --text: #e0e0e8;
            --text-muted: #8888a0;
            --accent: #7c5cfc;
            --accent-hover: #9b7fff;
            --green: #34d399;
            --red: #f87171;
            --yellow: #fbbf24;
            --blue: #60a5fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }

        /* Nav */
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            margin-right: 2rem;
        }
        .nav-links { display: flex; gap: 0.25rem; }
        .nav-links a {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--text);
            background: var(--surface2);
        }

        /* Layout */
        .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem; }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .card-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Grid */
        .grid { display: grid; gap: 1rem; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }

        /* Stats */
        .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .btn-danger:hover { background: var(--red); color: #fff; }
        .btn-success { border-color: var(--green); color: var(--green); }
        .btn-success:hover { background: var(--green); color: #fff; }
        .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.8rem; }

        /* Forms */
        input, textarea, select {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            color: var(--text);
            font-size: 0.9rem;
            width: 100%;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .form-group { margin-bottom: 1rem; }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        tr:hover { background: var(--surface2); }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-green { background: rgba(52,211,153,0.15); color: var(--green); }
        .badge-red { background: rgba(248,113,113,0.15); color: var(--red); }
        .badge-yellow { background: rgba(251,191,36,0.15); color: var(--yellow); }
        .badge-blue { background: rgba(96,165,250,0.15); color: var(--blue); }
        .badge-gray { background: rgba(136,136,160,0.15); color: var(--text-muted); }

        /* Photo grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .photo-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .photo-card:hover { transform: translateY(-2px); }
        .photo-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
        }
        .photo-card .photo-info {
            padding: 0.75rem;
        }
        .photo-card .photo-actions {
            padding: 0.5rem 0.75rem;
            display: flex;
            gap: 0.3rem;
            border-top: 1px solid var(--border);
        }

        /* Alert */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .alert-success { background: rgba(52,211,153,0.1); border: 1px solid var(--green); color: var(--green); }
        .alert-error { background: rgba(248,113,113,0.1); border: 1px solid var(--red); color: var(--red); }

        /* Toggle switch */
        .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer; inset: 0;
            background: var(--surface2); border-radius: 24px;
            border: 1px solid var(--border); transition: 0.3s;
        }
        .toggle-slider::before {
            content: ""; position: absolute; height: 18px; width: 18px;
            left: 2px; bottom: 2px; background: var(--text-muted);
            border-radius: 50%; transition: 0.3s;
        }
        .toggle input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent); }
        .toggle input:checked + .toggle-slider::before { transform: translateX(20px); background: #fff; }

        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .flex { display: flex; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-1 { gap: 0.5rem; }
        .gap-2 { gap: 1rem; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 0.85rem; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/agency/" class="nav-brand">Agency42</a>
        <div class="nav-links">
            <a href="/agency/" class="{% if request.url.path == '/agency/' %}active{% endif %}">Dashboard</a>
            <a href="/agency/models" class="{% if '/models' in request.url.path %}active{% endif %}">Models</a>
            <a href="/agency/photos" class="{% if '/photos' in request.url.path %}active{% endif %}">Photos</a>
            <a href="/agency/queue" class="{% if '/queue' in request.url.path %}active{% endif %}">Queue</a>
            <a href="/agency/settings" class="{% if '/settings' in request.url.path %}active{% endif %}">Settings</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
